<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eapen Technology — social image source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Newsreader:wght@400;450;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        color: #f1ece2;
        background: #191616;
        font:
          400 18px/1.5 Archivo,
          sans-serif;
      }
      .card {
        display: grid;
        grid-template-columns: 1fr 355px;
        gap: 56px;
        padding: 48px 56px;
        height: 100%;
      }
      .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .brand {
        font:
          500 36px/0.85 Newsreader,
          Georgia,
          serif;
        letter-spacing: -1px;
      }
      .brand small {
        display: block;
        margin-top: 10px;
        font:
          400 8px/1 "IBM Plex Mono",
          monospace;
        letter-spacing: 3.4px;
      }
      h1 {
        font:
          450 83px/0.95 Newsreader,
          Georgia,
          serif;
        letter-spacing: -4px;
        margin: 55px 0 27px;
      }
      h1 span {
        color: #d6b36a;
      }
      p {
        margin: 0;
      }
      .url {
        margin-top: auto;
        padding-top: 25px;
        color: #b9aea3;
        font-size: 15px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        border-top: 5px solid #762a33;
      }
      img {
        width: 355px;
        height: 444px;
        object-fit: cover;
        display: block;
      }
      figcaption {
        flex: 1;
        background: #762a33;
        padding: 18px 22px;
      }
      figcaption strong {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      figcaption span {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="copy">
        <div class="brand">Eapen<small>TECHNOLOGY</small></div>
        <h1>
          Learn AI on<br /><span>your own<br />work.</span>
        </h1>
        <p>On-site AI training for company leaders.<br />With Justus Eapen.</p>
        <div class="url">eapentechnology.com</div>
      </div>
      <figure>
        <img
          src="/assets/justus-headshot-800.webp"
          width="800"
          height="1000"
          alt="Justus Eapen"
        />
        <figcaption>
          <strong>Justus Eapen</strong
          ><span>Your engineer. Your instructor.</span>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
