server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # Page, CSS, and module URLs are not fingerprinted. Revalidate each use.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:webp|avif|png|jpe?g|svg|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~ /\. {
        return 404;
    }
}
