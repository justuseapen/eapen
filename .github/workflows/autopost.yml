name: content-autopost

on:
  schedule:
    - cron: "10 14 * * *" # 10:10am ET daily; script no-ops unless something is due
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests requests-oauthlib

      - name: Post due content
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/autopost.py

      - name: Record results
        if: always()
        run: |
          git config user.name "content-autopost"
          git config user.email "autopost@eapentechnology.com"
          git add content/queue/
          git diff --cached --quiet && exit 0
          git commit -m "autopost: record posted content"
          git pull --rebase origin master
          git push origin master
